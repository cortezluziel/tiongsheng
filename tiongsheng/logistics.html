@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes heroFade{0%{opacity:0}6%{opacity:1}33%{opacity:1}40%{opacity:0}100%{opacity:0}}

.reveal{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) .25s both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}
@media (prefers-reduced-motion: reduce){.reveal,.enter,.hero-slide{animation:none!important}.hero-slide:first-child{opacity:1}.img-frame img{transition:none}}

<script>
class Component extends DCLogic {
  renderVals() {
    const active = (this.state && this.state.tab) || 'warehousing';
    const data = {
      warehousing: {
        label: 'Warehousing', title: 'Secure Warehousing',
        intro: 'Closely monitored, secure storage for your goods — short or long term — with space planned to keep handling efficient.',
        points: ['Monitored, secure facilities', 'Short- and long-term storage', 'Space-optimised layout', 'Ready for onward delivery'],
        ideal: ['Inventory buffers', 'Project materials', 'Import staging'],
        photo: '[Photo — warehouse interior]', img: 'assets/img/warehouse-storage.jpg', alt: 'Palletised cargo stored in the warehouse'
      },
      stuffing: {
        label: 'Stuffing & Unstuffing', title: 'Container Stuffing & Unstuffing',
        intro: 'Goods loaded into and out of containers with a systematic process that reduces risk and shortens turnaround.',
        points: ['Systematic loading plans', 'Careful unloading', 'Reduced damage risk', 'Faster turnaround'],
        ideal: ['Export consignments', 'Mixed cargo', 'Fragile goods'],
        photo: '[Photo — container stuffing]', img: 'assets/img/container-loading-ramp.jpg', alt: 'Loading ramp leading into a shipping container'
      },
      containers: {
        label: 'Container Handling', title: 'Container Handling',
        intro: 'Meticulous handling and planning so containers load and unload smoothly, cargo stays intact and shipments stay on schedule.',
        points: ['20 ft and 40 ft containers', 'Planned lifts and moves', 'Cargo integrity checks', 'Schedule coordination'],
        ideal: ['FCL shipments', 'Port transfers', 'Time-critical cargo'],
        photo: '[Photo — container yard]', img: 'assets/img/container-interior.jpg', alt: 'Inside a shipping container ready for unstuffing'
      },
      distribution: {
        label: 'Distribution', title: 'Distribution',
        intro: 'Distribution designed for safe, quick delivery — moving goods from storage to their destination without delay.',
        points: ['Local delivery from storage', 'Coordinated with freight', 'Safe handling in transit', 'Status updates'],
        ideal: ['Retail replenishment', 'Site deliveries', 'B2B orders'],
        photo: '[Photo — goods out for delivery]', img: 'assets/img/truck-solar-modules-warehouse.jpg', alt: 'Truck loaded with palletised solar modules at a warehouse'
      }
    };
    const base = 'flex: 1 1 auto; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border: none; border-radius: 8px; padding: 12px 18px; min-height: 48px; ';
    const tabs = Object.keys(data).map((id) => ({
      label: data[id].label,
      selected: id === active ? 'true' : 'false',
      pick: () => this.setState({ tab: id }),
      btnStyle: base + (id === active ? 'background: #26338F; color: #FFFFFF; box-shadow: inset 0 -3px 0 #D7191F;' : 'background: transparent; color: #26338F;')
    }));
    return { tabs: tabs, panel: data[active] };
  }
}
DC.mount(Component, {});
</script>
