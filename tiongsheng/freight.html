/* Image animations: Elementor equivalents noted in the hand-off */
.img-frame{overflow:hidden;position:relative;background:#DDE4EB}

@keyframes fadeUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes heroFade{0%{opacity:0}6%{opacity:1}33%{opacity:1}40%{opacity:0}100%{opacity:0}}
.enter{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.hero-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:0;animation:heroFade 18s linear infinite,kenburns 18s linear infinite}
.reveal{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) .25s both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}
@media (prefers-reduced-motion: reduce){.reveal,.enter,.hero-slide{animation:none!important}.hero-slide:first-child{opacity:1}.img-frame img{transition:none}}

<script>
class Component extends DCLogic {
  renderVals() {
    const active = (this.state && this.state.tab) || 'sea';
    const data = {
      sea: {
        label: 'Sea Freight', title: 'Sea Freight — LCL & FCL',
        intro: 'Whatever the volume, we handle sea shipments efficiently: share container space with less-than-container loads (LCL), or book a full container (FCL) for larger consignments.',
        points: ['Less-than-container load (LCL)', 'Full-container load (FCL)', 'Break-bulk and oversized cargo', 'Booking with major shipping lines'],
        ideal: ['Bulk goods', 'Machinery', 'Cost-sensitive shipments'],
        photo: '[Photo — container vessel at port]', img: 'assets/img/container-interior.jpg', alt: 'Inside a shipping container ready for unstuffing'
      },
      air: {
        label: 'Air Freight', title: 'Air Freight',
        intro: 'Fast, flexible air transport for urgent and routine shipments alike, tailored to what each consignment needs.',
        points: ['Door-to-door delivery', 'Airport-to-airport service', 'Urgent and time-critical cargo', 'Routine scheduled shipments'],
        ideal: ['Urgent parts', 'High-value goods', 'Samples'],
        photo: '[Photo — air cargo loading]', img: 'assets/img/truck-solar-industrial.jpg', alt: 'Solar module pallets on a crane truck at an industrial site'
      },
      land: {
        label: 'Land Transport', title: 'Land Transport',
        intro: 'Local and regional road transport to and from ports, warehouses and project sites — coordinated with our own lorries, cranes and trailers.',
        points: ['Port and warehouse transfers', 'Delivery to project sites', 'Heavy and oversized loads', 'Coordinated with lifting services'],
        ideal: ['Local delivery', 'Port haulage', 'Project cargo'],
        photo: '[Photo — lorry on delivery]', img: 'assets/img/truck-solar-pallets-yard.jpg', alt: 'Crane truck with wrapped solar module pallets in a yard'
      },
      customs: {
        label: 'Customs & Documentation', title: 'Customs Clearance & Documentation',
        intro: 'Our team prepares the paperwork and manages customs clearance for a wide range of freight, keeping delays to a minimum and transit smooth.',
        points: ['Customs clearance', 'Shipping documentation', 'Guidance on requirements', 'Up-to-date shipment status'],
        ideal: ['First-time importers', 'Regulated goods', 'Complex routings'],
        photo: '[Photo — documents / port office]', img: 'assets/img/truck-bed-loading.jpg', alt: 'Cargo secured on a truck bed in a container yard'
      }
    };
    const base = 'flex: 1 1 auto; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border: none; border-radius: 8px; padding: 12px 18px; min-height: 48px; ';
    const tabs = Object.keys(data).map((id) => ({
      label: data[id].label,
      selected: id === active ? 'true' : 'false',
      pick: () => this.setState({ tab: id }),
      btnStyle: base + (id === active ? 'background: #26338F; color: #FFFFFF; box-shadow: inset 0 -3px 0 #D7191F;' : 'background: transparent; color: #26338F;')
    }));
    return { tabs: tabs, panel: data[active] };
  }
}
DC.mount(Component, {});
</script>
