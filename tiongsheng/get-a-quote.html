<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get a Quote | Tiong Sheng Services</title>
<meta name="description" content="Tiong Sheng Services: international freight forwarding by air, sea and land, warehousing and container handling, and lorry crane, mobile crane and trailer rental in Singapore.">
<link rel="icon" href="assets/img/tss-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#26338F}a:hover{color:#C8161D}
.navlink{color:#26338F;text-decoration:none;font-weight:600;font-size:15px;padding:12px 4px}
.navlink:hover{color:#C8161D}
.btn-primary{display:inline-flex;align-items:center;gap:10px;background:#D7191F;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:15px;padding:15px 26px;border-radius:8px;min-height:48px;box-sizing:border-box}
.btn-primary:hover{background:#B3141A;color:#FFFFFF}
.flink{color:#C9D4DF;text-decoration:none}
.flink:hover{color:#FF9EA2}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:#26338F}
.field input,.field select,.field textarea{font:inherit;font-weight:400;font-size:15px;padding:13px 14px;border:1.5px solid #C5D0DB;border-radius:8px;background:#FFFFFF;color:#26338F;min-height:48px;box-sizing:border-box;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#26338F;box-shadow:0 0 0 3px rgba(38,51,143,0.15)}
.field textarea{min-height:130px;resize:vertical}
.req{color:#C8161D}
.submit{font:inherit;font-weight:700;font-size:16px;background:#D7191F;color:#FFFFFF;border:none;border-radius:8px;padding:15px 32px;min-height:52px;cursor:pointer}
.submit:hover{background:#B3141A}

@keyframes fadeUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
.enter{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}
@media (prefers-reduced-motion: reduce){.enter{animation:none!important}}
</style>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This preview needs JavaScript turned on.</p></noscript>
<template id="page-template">


<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #44546A; background: #F6F8FA; width: 100%; font-size: 16px; line-height: 1.6">

<header style="background: #FFFFFF; border-bottom: 1px solid #E4E9EE">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
<a href="index.html" aria-label="Tiong Sheng Services home" style="display: flex; align-items: center; text-decoration: none"><img src="assets/img/tss-logo.png" alt="Tiong Sheng Services" style="height: 56px; width: auto; display: block"></a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px 28px; align-items: center">
<a class="navlink" href="index.html">Home</a>
<a class="navlink" href="about.html">About</a>
<a class="navlink" href="services.html">Services</a>
<a class="navlink" href="gallery.html">Gallery</a>
<a class="navlink" href="contact.html">Contact</a>
</nav>
<a class="btn-primary" href="get-a-quote.html" aria-current="page" style="box-shadow: 0 0 0 3px #FDECEC">Get a Quote</a>
</div>
</header>

<section style="background: #26338F">
<div style="max-width: 820px; margin: 0 auto; padding: 64px 24px 136px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center">
<nav aria-label="Breadcrumb" style="font-size: 14px; color: #9FB0C1"><a href="index.html" style="color: #C9D4DF; text-decoration: none">Home</a> / <span style="color: #FF9EA2">Get a Quote</span></nav>
<h1 class="enter" style="margin: 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 48px; line-height: 1.1; letter-spacing: -1px; color: #FFFFFF">Request a free quote</h1>
<p class="enter d1" style="margin: 0; font-size: 18px; color: #C9D4DF; max-width: 560px">Fill in the form below and our team will get back to you with a quotation.</p>
</div>
</section>

<section>
<div style="max-width: 820px; margin: -96px auto 0; padding: 0 24px 88px; box-sizing: border-box">
<div class="enter d2" style="background: #FFFFFF; border-radius: 16px; box-shadow: 0 12px 40px rgba(38,51,143,0.10); padding: 40px; box-sizing: border-box">

<sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
<form style="display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 18px 20px">
<label class="field"><span>Full name <span class="req" aria-hidden="true">*</span></span><input type="text" autocomplete="name" required=""></label>
<label class="field">Company<input type="text" autocomplete="organization"></label>
<label class="field"><span>Email <span class="req" aria-hidden="true">*</span></span><input type="email" autocomplete="email" required=""></label>
<label class="field"><span>Phone / WhatsApp <span class="req" aria-hidden="true">*</span></span><input type="tel" autocomplete="tel" placeholder="+65" required=""></label>
<label class="field"><span>Service required <span class="req" aria-hidden="true">*</span></span>
<select required="">
<option value="">Select a service</option>
<option>Freight forwarding — Sea</option>
<option>Freight forwarding — Air</option>
<option>Land transport / delivery</option>
<option>Warehousing</option>
<option>Container stuffing / unstuffing</option>
<option>Lorry crane rental (20 t / 25 t)</option>
<option>Mobile crane rental (50 t – 130 t)</option>
<option>Trailer rental</option>
<option>Not sure — please advise</option>
</select>
</label>
<label class="field">Preferred date<input type="date"></label>
<label class="field">Pick-up / origin<input type="text" placeholder="Address, city or port"></label>
<label class="field">Delivery / site location<input type="text" placeholder="Address, city or port"></label>
</div>
<label class="field"><span>Cargo or job details <span class="req" aria-hidden="true">*</span></span><textarea required="" placeholder="What are you moving or lifting? Include weight, size, quantity and any site access notes."></textarea></label>
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; cursor: pointer"><input type="checkbox" style="width: 20px; height: 20px; margin-top: 2px; accent-color: #26338F; flex: none">I agree to Tiong Sheng Services using my details to respond to this enquiry, in line with the Privacy Policy (PDPA).</label>
<div style="display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; border-top: 1.5px solid #E4E9EE; padding-top: 22px">
<span style="font-size: 14px"><span class="req">*</span> Required fields</span>
<button type="button" class="submit" onClick="{{send}}">Submit request</button>
</div>
</form>
</sc-if>

<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div class="enter" style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 28px 0">
<span style="width: 72px; height: 72px; border-radius: 999px; background: #FDECEC; display: flex; align-items: center; justify-content: center">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#B3141A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
</span>
<h2 style="margin: 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 30px; color: #26338F">Thank you — request received</h2>
<p style="margin: 0; max-width: 460px">Our team will review your enquiry and get back to you shortly. For anything urgent, call +65 8748 8313.</p>
<button type="button" onClick="{{reset}}" style="font: inherit; font-weight: 700; background: none; color: #26338F; border: 1.5px solid #C5D0DB; border-radius: 8px; padding: 12px 22px; min-height: 48px; cursor: pointer">Submit another request</button>
</div>
</sc-if>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 10px 28px; justify-content: center; padding-top: 28px; font-size: 15px">
<span>Prefer to talk?</span>
<a href="tel:+6587488313" style="font-weight: 700">+65 8748 8313</a>
<a href="https://wa.me/6587488313" style="font-weight: 700">WhatsApp us</a>
<a href="mailto:tss.transport@tiongshengservices.com" style="font-weight: 700">tss.transport@tiongshengservices.com</a>
</div>
</div>
</section>

<footer style="background: #141B54; color: #C9D4DF; font-size: 15px">
<div style="max-width: 1200px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: 13px; color: #9FB0C1"><span>© 2026 Tiong Sheng Services Pte Ltd · Co. Reg. 202402932G</span><span><a class="flink" href="contact.html">Contact</a> · Privacy Policy · PDPA</span></div>
</footer>

</div>
</template>
<script src="assets/js/morphdom-umd.min.js"></script>
<script src="assets/js/dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const sent = !!(this.state && this.state.sent);
    return {
      sent: sent, notSent: !sent,
      send: () => this.setState({ sent: true }),
      reset: () => this.setState({ sent: false })
    };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
