@keyframes heroFade{0%{opacity:0}6%{opacity:1}33%{opacity:1}40%{opacity:0}100%{opacity:0}}

.reveal{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) .25s both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}
@media (prefers-reduced-motion: reduce){.reveal,.enter,.hero-slide{animation:none!important}.hero-slide:first-child{opacity:1}.img-frame img{transition:none}}

<script>
class Component extends DCLogic {
  renderVals() {
    const active = (this.state && this.state.tab) || 'lorry';
    const data = {
      lorry: {
        label: 'Lorry Cranes', title: 'Lorry Crane Rental',
        intro: 'Truck-mounted cranes that lift and deliver in one trip — ideal for everyday loads, site deliveries and tight access.',
        specs: [{ k: 'Capacity', v: '20 t' }, { k: 'Capacity', v: '25 t' }, { k: 'Boom reach', v: '[m]' }],
        points: ['Lift and deliver in one trip', 'Suited to urban and tight sites', 'Machinery and material delivery', 'Container lifting'],
        photo: '[Photo — lorry crane on site]', img: 'assets/img/lorry-crane-balcony-lift.jpg', alt: 'Lorry crane lifting materials to a high-rise balcony'
      },
      mobile: {
        label: 'Mobile Cranes', title: 'Mobile Crane Rental',
        intro: 'High-capacity mobile cranes for heavy and complex lifts on construction, industrial and project sites.',
        specs: [{ k: 'Capacity', v: '50 t' }, { k: 'Capacity', v: '100 t' }, { k: 'Capacity', v: '130 t' }],
        points: ['Heavy and complex lifts', 'Construction and industrial sites', 'Project cargo installation', 'Lift planning support'],
        photo: '[Photo — 130 t mobile crane]', img: 'assets/img/mobile-crane-rooftop-lift.jpg', alt: 'Mobile crane lifting a load to a rooftop'
      },
      trailer: {
        label: 'Trailers', title: 'Trailer Services',
        intro: 'Trailers for heavy haulage and oversized cargo, moving loads between ports, warehouses and sites.',
        specs: [{ k: 'Type', v: '[Flatbed]' }, { k: 'Type', v: '[Low-loader]' }, { k: 'Length', v: '[ft]' }],
        points: ['Heavy haulage', 'Oversized and project cargo', 'Port and site transfers', 'Paired with crane lifts'],
        photo: '[Photo — trailer with heavy load]', img: 'assets/img/trailer-heavy-haulage.jpg', alt: 'Trailer hauling an oversized steel structure'
      },
      dispatch: {
        label: 'Dispatch & Delivery', title: 'Local Dispatch & Delivery',
        intro: 'Local dispatch and delivery services across the region, scheduled around your job and backed by our partner network.',
        specs: [{ k: 'Coverage', v: 'Singapore' }, { k: 'Coverage', v: '[Region]' }, { k: 'Rates', v: 'Competitive' }],
        points: ['Scheduled local dispatch', 'Regional delivery', 'Flexible fleet through partners', 'Reliable, on-time service'],
        photo: '[Photo — delivery fleet]', img: 'assets/img/lorry-crane-crated-delivery.jpg', alt: 'Crane truck delivering crated cargo to a building'
      }
    };
    const base = 'flex: 1 1 auto; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border: none; border-radius: 8px; padding: 12px 18px; min-height: 48px; ';
    const tabs = Object.keys(data).map((id) => ({
      label: data[id].label,
      selected: id === active ? 'true' : 'false',
      pick: () => this.setState({ tab: id }),
      btnStyle: base + (id === active ? 'background: #26338F; color: #FFFFFF; box-shadow: inset 0 -3px 0 #D7191F;' : 'background: transparent; color: #26338F;')
    }));
    return { tabs: tabs, panel: data[active] };
  }
}
DC.mount(Component, {});
</script>
