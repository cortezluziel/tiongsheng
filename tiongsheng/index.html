<script>
class Component extends DCLogic {
  renderVals() {
    const active = (this.state && this.state.tab) || this.props.defaultTab || 'freight';
    const defs = [
      { id: 'freight', label: 'Freight Forwarding', sub: 'Air · Sea · Land' },
      { id: 'logistics', label: 'Logistics & Warehousing', sub: 'Storage · Containers' },
      { id: 'rental', label: 'Equipment Rental', sub: 'Cranes · Trailers' }
    ];
    const base = 'flex: 1 1 220px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 16px 20px; min-height: 64px; ';
    const tabs = defs.map((d) => ({
      label: d.label,
      sub: d.sub,
      selected: d.id === active ? 'true' : 'false',
      pick: () => this.setState({ tab: d.id }),
      btnStyle: base + (d.id === active
        ? 'background: #26338F; color: #FFFFFF; box-shadow: inset 0 -3px 0 #D7191F;'
        : 'background: transparent; color: #26338F;')
    }));
    return {
      tabs: tabs,
      isFreight: active === 'freight',
      isLogistics: active === 'logistics',
      isRental: active === 'rental',
      steps: [
        { n: '1', title: 'Enquire', text: 'Tell us the service, cargo and timeline.' },
        { n: '2', title: 'Quote', text: 'Receive a clear, competitive quotation.' },
        { n: '3', title: 'Schedule', text: 'We plan the route, equipment and crew.' },
        { n: '4', title: 'Deliver', text: 'Track progress until the job is done.' }
      ]
    };
  }
}
DC.mount(Component, {"defaultTab": "freight"});
</script>
