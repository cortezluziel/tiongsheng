<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#26338F}a:hover{color:#C8161D}
.ph{background-color:#DDE4EB;background-image:repeating-linear-gradient(135deg,rgba(38,51,143,0.05) 0 2px,transparent 2px 14px)}
.navlink{color:#26338F;text-decoration:none;font-weight:600;font-size:15px;padding:12px 4px}
.navlink:hover{color:#C8161D}
.navlink.on{color:#C8161D;box-shadow:inset 0 -2px 0 #D7191F}
.btn-primary{display:inline-flex;align-items:center;gap:10px;background:#D7191F;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:15px;padding:15px 26px;border-radius:8px;min-height:48px;box-sizing:border-box}
.btn-primary:hover{background:#B3141A;color:#FFFFFF}
.btn-ghost{display:inline-flex;align-items:center;gap:10px;color:#26338F;text-decoration:none;font-weight:700;font-size:15px;padding:15px 24px;border-radius:8px;border:1.5px solid #C5D0DB;min-height:48px;box-sizing:border-box}
.btn-ghost:hover{border-color:#26338F;color:#26338F}
.flink{color:#C9D4DF;text-decoration:none}
.flink:hover{color:#FF9EA2}

/* Image animations: Elementor equivalents noted in the hand-off */
.img-frame{overflow:hidden;position:relative;background:#DDE4EB}
.img-frame img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.img-frame:hover img{transform:scale(1.06)}
@keyframes fadeUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes heroFade{0%{opacity:0}6%{opacity:1}33%{opacity:1}40%{opacity:0}100%{opacity:0}}
.enter{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.hero-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:0;animation:heroFade 18s linear infinite,kenburns 18s linear infinite}
.reveal{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) .25s both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}
@media (prefers-reduced-motion: reduce){.reveal,.enter,.hero-slide{animation:none!important}.hero-slide:first-child{opacity:1}.img-frame img{transition:none}}
</style>
<link rel="stylesheet" href="assets/css/site.css">
</head>

<!-- Service tabs -->
<section style="background: #FFFFFF">

<!-- Process -->
<section style="background: #F6F8FA">
<div style="max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px">
<h2 style="margin: 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -0.7px; color: #26338F; text-align: center">From enquiry to delivery</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 24px">
<li style="background: #FFFFFF; border-radius: 12px; padding: 26px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: Manrope, sans-serif; font-weight: 800; color: #C8161D">01</span><span style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 19px; color: #26338F">Enquire</span><span style="font-size: 15px">Share the service, cargo and timeline.</span></li>
<li style="background: #FFFFFF; border-radius: 12px; padding: 26px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: Manrope, sans-serif; font-weight: 800; color: #C8161D">02</span><span style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 19px; color: #26338F">Quote</span><span style="font-size: 15px">Receive a clear, competitive quotation.</span></li>
<li style="background: #FFFFFF; border-radius: 12px; padding: 26px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: Manrope, sans-serif; font-weight: 800; color: #C8161D">03</span><span style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 19px; color: #26338F">Schedule</span><span style="font-size: 15px">We plan the route, equipment and crew.</span></li>
<li style="background: #FFFFFF; border-radius: 12px; padding: 26px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: Manrope, sans-serif; font-weight: 800; color: #C8161D">04</span><span style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 19px; color: #26338F">Deliver</span><span style="font-size: 15px">Status updates until the job is done.</span></li>
</ol>

<!-- FAQ -->

<h2 style="margin: 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -0.7px; color: #26338F; text-align: center">Frequently asked questions</h2>

<section style="background: #FFFFFF">

<div style="display: flex; flex-direction: column; gap: 10px"><span style="font-family: Manrope, sans-serif; font-weight: 700; color: #FFFFFF">Company</span><a class="flink" href="about.html">About</a><a class="flink" href="services.html">Services</a><a class="flink" href="gallery.html">Gallery</a><a class="flink" href="contact.html">Contact</a></div>

</div>
<div style="max-width: 1200px; margin: 0 auto; padding: 20px 24px 28px; border-top: 1px solid #29317A; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: 13px; color: #9FB0C1"><span>© 2026 Tiong Sheng Services Pte Ltd · Co. Reg. 202402932G</span><span>Privacy Policy · PDPA</span></div>
</footer>

</div>

<script src="assets/js/morphdom-umd.min.js"></script>
<script src="assets/js/dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const active = st.svc || 'freight';
    const sub = st.sub || 'overview';
    const openFaq = st.faq === undefined ? 0 : st.faq;
    const data = {
      freight: {
        num: '01', label: 'Freight Forwarding', sub: 'Air · Sea · Land',
        title: 'Freight Transportation Arrangement',
        overview: 'Comprehensive transport options by air, sea and land, with smooth delivery prioritised for every shipment.',
        overview2: 'Strategic partnerships with major shipping lines and break-bulk carriers let us offer cost-effective, reliable international forwarding from origin to destination.',
        caps: ['Air freight', 'Sea freight (FCL / LCL)', 'Land transport', 'Break-bulk and oversized cargo', 'Documentation guidance', 'Up-to-date shipment status'],
        specHead1: 'Mode', specHead2: 'Best for',
        specs: [{ a: 'Air', b: 'Urgent and high-value cargo' }, { a: 'Sea', b: 'Large volumes and cost efficiency' }, { a: 'Land', b: 'Local and regional delivery' }],
        cta: 'Quote for freight', page: 'freight.html', photo: '[Photo — container vessel or air cargo loading]', img: 'assets/img/truck-solar-modules-warehouse.jpg', alt: 'Truck loaded with palletised solar modules at a warehouse'
      },
      logistics: {
        num: '02', label: 'Logistics Services', sub: 'Warehousing · Containers',
        title: 'Logistics Services',
        overview: 'Secure warehousing and precise container handling, planned to make the most of space and keep handling time down.',
        overview2: 'Your goods are stored safely and ready to move when you are, with one team coordinating storage and onward transport.',
        caps: ['Secure warehousing', 'Container stuffing and unstuffing', 'Space-optimised storage', 'Coordination with onward freight'],
        specHead1: 'Service', specHead2: 'Details',
        specs: [{ a: 'Warehousing', b: '[Storage area / terms]' }, { a: 'Container handling', b: '[20 ft / 40 ft]' }, { a: 'Location', b: 'Singapore' }],
        cta: 'Quote for logistics', page: 'logistics.html', photo: '[Photo — warehouse interior or container stuffing]', img: 'assets/img/warehouse-storage.jpg', alt: 'Palletised cargo stored in the warehouse'
      },
      rental: {
        num: '03', label: 'Equipment Rental', sub: 'Cranes · Trailers',
        title: 'Transportation & Equipment Rental',
        overview: 'Specialised lifting operations and hauler services, with the right machine sized to your job.',
        overview2: 'From lorry cranes for everyday lifts to mobile cranes up to 130 tons and trailers for heavy haulage.',
        caps: ['Lorry crane rental', 'Mobile crane rental', 'Trailer services', 'Lift planning support'],
        specHead1: 'Equipment', specHead2: 'Capacity',
        specs: [{ a: 'Lorry crane', b: '20 t · 25 t' }, { a: 'Mobile crane', b: '50 t · 100 t · 130 t' }, { a: 'Trailer', b: '[Trailer types / lengths]' }],
        cta: 'Book equipment', page: 'transportation-rental.html', photo: '[Photo — 130 t mobile crane on site]', img: 'assets/img/mobile-crane-rooftop-lift.jpg', alt: 'Mobile crane lifting a load to a rooftop'
      }
    };
    const svc = data[active];
    const card = 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; font: inherit; cursor: pointer; border-radius: 12px; padding: 22px 24px; min-height: 64px; ';
    const svcTabs = ['freight', 'logistics', 'rental'].map((id) => ({
      num: data[id].num, label: data[id].label, sub: data[id].sub,
      selected: id === active ? 'true' : 'false',
      pick: () => this.setState({ svc: id, sub: 'overview' }),
      btnStyle: card + (id === active
        ? 'background: #26338F; color: #FFFFFF; border: 1.5px solid #26338F; box-shadow: inset 0 -4px 0 #D7191F;'
        : 'background: #FFFFFF; color: #26338F; border: 1.5px solid #E4E9EE;')
    }));
    const subBase = 'font: inherit; font-weight: 600; font-size: 15px; background: none; border: none; cursor: pointer; padding: 12px 16px; min-height: 48px; margin-bottom: -1.5px; ';
    const subTabs = [['overview', 'Overview'], ['caps', 'Capabilities'], ['specs', active === 'rental' ? 'Equipment & specs' : 'At a glance']].map((p) => ({
      label: p[1],
      selected: p[0] === sub ? 'true' : 'false',
      pick: () => this.setState({ sub: p[0] }),
      btnStyle: subBase + (p[0] === sub ? 'color: #26338F; border-bottom: 3px solid #D7191F;' : 'color: #5B6B7A; border-bottom: 3px solid transparent;')
    }));
    const faqSrc = [
      { q: 'How do I get a quote?', a: 'Use the Get a Quote form, call +65 8748 8313 or email us with your cargo or lift details. Quotes are free and without obligation.' },
      { q: 'Can you handle oversized or break-bulk cargo?', a: 'Yes. We work with break-bulk carriers and can combine forwarding with our own lifting and hauler services.' },
      { q: 'Which crane do I need for my lift?', a: 'Tell us the load weight, dimensions and site conditions and we will recommend a lorry crane (20–25 t) or mobile crane (50–130 t).' },
      { q: 'Will I get updates during the shipment?', a: 'Yes — you receive up-to-date status information and schedules throughout the job.' }
    ];
    const faqs = faqSrc.map((f, i) => ({
      q: f.q, a: f.a, open: i === openFaq, expanded: i === openFaq ? 'true' : 'false', sign: i === openFaq ? '−' : '+',
      toggle: () => this.setState({ faq: i === openFaq ? -1 : i })
    }));
    return {
      svc: svc, svcTabs: svcTabs, subTabs: subTabs, faqs: faqs,
      showOverview: sub === 'overview', showCaps: sub === 'caps', showSpecs: sub === 'specs'
    };
  }
}
DC.mount(Component, {});
</script>
</body>
